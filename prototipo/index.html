<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Llégate · Sistema</title>
  <meta name="description" content="Prototipo del sistema de Llégate a Lechería: clientes, reservas, cobros y estadísticas.">
  <meta name="theme-color" content="#fffdf8">
  <link rel="icon" href="assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Onest:wght@400..700&display=swap">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="app">
    <aside class="side">
      <a class="brand" href="#clientes">
        <img src="assets/logo.png" alt="">
        <div><b>Llégate a Lechería</b><span>Sistema administrativo</span></div>
      </a>
      <nav class="nav" aria-label="Secciones">
        <a href="#clientes" data-nav="clientes"><i data-lucide="users"></i>Clientes <span class="count" id="count-nuevos"></span></a>
        <a href="#reservas" data-nav="reservas"><i data-lucide="calendar-check"></i>Reservas y cobros</a>
        <a href="#estadisticas" data-nav="estadisticas"><i data-lucide="chart-column"></i>Estadísticas</a>
      </nav>
      <div class="side-foot">
        <a href="landing.html"><i data-lucide="external-link"></i>Ver la página de clientes</a>
        <button type="button" id="reset"><i data-lucide="rotate-ccw"></i>Restablecer ejemplo</button>
        <p class="demo-note">Prototipo con datos de ejemplo. Lo que cambies se guarda solo en este navegador.</p>
      </div>
    </aside>

    <main class="main" id="view" tabindex="-1"></main>
  </div>

  <nav class="tabbar" aria-label="Secciones">
    <a href="#clientes" data-nav="clientes"><i data-lucide="users"></i>Clientes</a>
    <a href="#reservas" data-nav="reservas"><i data-lucide="calendar-check"></i>Reservas</a>
    <a href="#estadisticas" data-nav="estadisticas"><i data-lucide="chart-column"></i>Números</a>
    <a href="landing.html"><i data-lucide="globe"></i>Página</a>
  </nav>

  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title"></aside>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
